# Nginx Reverse Proxy snippet for Mattermost Push Proxy Server
# Place this in /etc/nginx/sites-available/push-proxy.conf or embed into your existing Mattermost nginx config

upstream mattermost_push_backend {
    server 127.0.0.1:8066;
    keepalive 32;
}

server {
    listen 80;
    server_name push.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name push.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/push.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/mattermost_push_access.log;
    error_log /var/log/nginx/mattermost_push_error.log;

    location / {
        proxy_pass http://mattermost_push_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
